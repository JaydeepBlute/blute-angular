stages:
  - build
  - deploy

build_app:
  stage: build
  image: node:20-alpine
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - node_modules/
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH'

deploy_firebase:
  stage: deploy
  image: node:20-alpine
  dependencies:
    - build_app
  script:
    - npx firebase-tools@15 deploy --only hosting --token "$FIREBASE_TOKEN" --non-interactive
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "master"'

deploy_vps:
  stage: deploy
  image: alpine:latest
  dependencies:
    - build_app
  before_script:
    - apk add --no-cache sshpass openssh-client rsync
  script:
    - sshpass -p "$VPS_PASSWORD" rsync -atv -e "ssh -o StrictHostKeyChecking=no" dist/blute-app/browser/ root@$VPS_IP:/var/www/blute-org/
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "master"'
