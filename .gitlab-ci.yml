stages:
  - build
  - deploy

build_app:
  stage: build
  image: node:20-alpine
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - node_modules/
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH'

deploy_app:
  stage: deploy
  image: node:20-alpine
  dependencies:
    - build_app
  script:
    - npx firebase-tools@15 deploy --only hosting --token "$FIREBASE_TOKEN" --non-interactive
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "master"'
