<div class="fixed bottom-6 right-6 z-[9999] flex flex-col items-end gap-3">

  <!-- ── Chat panel ──────────────────────────────── -->
  <div *ngIf="isOpen" @panelAnim
    class="flex flex-col overflow-hidden"
    style="width:370px; max-height:520px; border-radius:20px;
           background:#0d1426;
           border:1px solid rgba(83,58,253,0.35);
           box-shadow:0 24px 64px rgba(0,0,0,0.65), 0 0 0 1px rgba(83,58,253,0.10);">

    <!-- Header bar -->
    <div class="flex items-center gap-3 px-5 py-4 flex-shrink-0"
      style="background:linear-gradient(135deg,#533AFD 0%,#7B5CF0 100%);">
      <div class="w-9 h-9 rounded-full flex items-center justify-center text-white font-bold text-sm flex-shrink-0"
        style="background:rgba(255,255,255,0.20); font-family:var(--font-display);">B</div>
      <div class="flex-1 min-w-0">
        <div class="text-white font-semibold text-sm">Blute AI Assistant</div>
        <div class="flex items-center gap-1.5 text-xs" style="color:rgba(255,255,255,0.72);">
          <span class="w-1.5 h-1.5 rounded-full inline-block"
            style="background:#4ade80; box-shadow:0 0 5px #4ade80;"></span>
          Online · Replies instantly
        </div>
      </div>
      <button (click)="toggle()"
        class="w-7 h-7 rounded-full flex items-center justify-center text-white cursor-pointer flex-shrink-0"
        style="background:rgba(255,255,255,0.15); border:none; transition:background 150ms;"
        onmouseenter="this.style.background='rgba(255,255,255,0.28)'"
        onmouseleave="this.style.background='rgba(255,255,255,0.15)'">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Message scroll area -->
    <div #scrollArea
      class="flex-1 overflow-y-auto p-4 space-y-3"
      style="min-height:0; scrollbar-width:thin; scrollbar-color:rgba(83,58,253,0.35) transparent;">

      <ng-container *ngFor="let msg of messages">

        <!-- Bot bubble -->
        <div *ngIf="msg.from === 'bot'" class="flex items-start gap-2">
          <div class="w-6 h-6 rounded-full flex-shrink-0 flex items-center justify-center text-white text-xs font-bold"
            style="background:linear-gradient(135deg,#533AFD,#F72DF3); margin-top:2px;">B</div>
          <div class="text-sm leading-relaxed"
            style="background:rgba(255,255,255,0.07);
                   color:rgba(210,218,230,0.95);
                   border-radius:4px 14px 14px 14px;
                   padding:10px 14px;
                   max-width:272px;
                   white-space:pre-line;">{{ msg.text }}</div>
        </div>

        <!-- User bubble -->
        <div *ngIf="msg.from === 'user'" class="flex justify-end">
          <div class="text-sm leading-relaxed text-white"
            style="background:#533AFD;
                   border-radius:14px 14px 4px 14px;
                   padding:10px 14px;
                   max-width:272px;">{{ msg.text }}</div>
        </div>

      </ng-container>

      <!-- Typing indicator -->
      <div *ngIf="isTyping" class="flex items-start gap-2">
        <div class="w-6 h-6 rounded-full flex-shrink-0 flex items-center justify-center text-white text-xs font-bold"
          style="background:linear-gradient(135deg,#533AFD,#F72DF3);">B</div>
        <div class="flex items-center gap-1 px-4 py-3"
          style="background:rgba(255,255,255,0.07); border-radius:4px 14px 14px 14px;">
          <span class="typing-dot"></span>
          <span class="typing-dot" style="animation-delay:0.2s;"></span>
          <span class="typing-dot" style="animation-delay:0.4s;"></span>
        </div>
      </div>

    </div>

    <!-- Input bar -->
    <div class="flex items-center gap-2 px-3 py-3 flex-shrink-0"
      style="border-top:1px solid rgba(255,255,255,0.07); background:rgba(255,255,255,0.02);">
      <input
        [(ngModel)]="inputText"
        (keydown.enter)="send()"
        [disabled]="isTyping"
        placeholder="Type a message…"
        class="flex-1 text-sm outline-none bg-transparent"
        style="background:rgba(255,255,255,0.06);
               border:1px solid rgba(255,255,255,0.10);
               border-radius:12px; padding:9px 14px; color:white;
               transition:border-color 150ms;"
        onfocus="this.style.borderColor='rgba(83,58,253,0.70)'"
        onblur="this.style.borderColor='rgba(255,255,255,0.10)'" />
      <button
        (click)="send()"
        [disabled]="isTyping || !inputText.trim()"
        class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0 cursor-pointer"
        style="background:#533AFD; border:none;
               transition:background 150ms, transform 150ms;"
        onmouseenter="if(!this.disabled){this.style.background='#4430D4';this.style.transform='scale(1.1)';}"
        onmouseleave="this.style.background='#533AFD';this.style.transform='scale(1)';">
        <svg class="w-4 h-4" fill="none" stroke="white" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
        </svg>
      </button>
    </div>

  </div>

  <!-- ── Launcher button ─────────────────────────── -->
  <button
    (click)="toggle()"
    class="relative flex items-center gap-2.5 text-white font-medium text-sm cursor-pointer"
    style="background:linear-gradient(135deg,#533AFD 0%,#7B5CF0 100%);
           padding:13px 22px; border-radius:50px; border:none;
           box-shadow:0 4px 20px rgba(83,58,253,0.55);
           transition:transform 220ms cubic-bezier(0.34,1.56,0.64,1), box-shadow 220ms;"
    onmouseenter="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 8px 30px rgba(83,58,253,0.70)';"
    onmouseleave="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 20px rgba(83,58,253,0.55)';">

    <!-- Chat icon when closed -->
    <svg *ngIf="!isOpen" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
    </svg>
    <!-- Close icon when open -->
    <svg *ngIf="isOpen" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
    </svg>

    <span>{{ isOpen ? 'Close' : 'Chat with us' }}</span>

    <!-- Pulse ring — attention grabber when closed -->
    <span *ngIf="!isOpen"
      class="absolute inset-0 rounded-full pointer-events-none"
      style="animation:chatPulse 2.5s ease-out infinite; border:2px solid rgba(83,58,253,0.6);"></span>

  </button>

</div>
