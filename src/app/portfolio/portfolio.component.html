<!-- ===== HERO ===== -->
<section class="pf-hero">
  <!-- Animated mesh gradient background -->
  <div class="pf-hero__mesh"></div>

  <!-- Floating blobs -->
  <div class="pf-hero__blob pf-hero__blob--1"></div>
  <div class="pf-hero__blob pf-hero__blob--2"></div>
  <div class="pf-hero__blob pf-hero__blob--3"></div>

  <!-- Floating particles -->
  <div class="pf-hero__particles">
    <span class="pf-hero__p" *ngFor="let p of heroParticles" [style.left.%]="p.x" [style.top.%]="p.y"
      [style.width.px]="p.size" [style.height.px]="p.size" [style.animation-duration]="p.duration + 's'"
      [style.animation-delay]="p.delay + 's'">
    </span>
  </div>

  <div class="pf-hero__inner">

    <!-- LEFT: Logo -->
    <div class="pf-hero__logo-col">
      <div class="pf-hero__logo-scene">
        <!-- Rings -->
        <div class="pf-hero__r pf-hero__r--a"></div>
        <div class="pf-hero__r pf-hero__r--b"></div>
        <div class="pf-hero__r pf-hero__r--c"></div>
        <!-- Orbiting dots -->
        <div class="pf-hero__od pf-hero__od--1"><span></span></div>
        <div class="pf-hero__od pf-hero__od--2"><span></span></div>
        <div class="pf-hero__od pf-hero__od--3"><span></span></div>
        <!-- Logo -->
        <div class="pf-hero__logo-disc">
          <div class="pf-hero__logo-shine"></div>
          <img src="assets/images/clients/blutelogo.jpeg" alt="Blute Technologies" />
        </div>
      </div>

      <!-- Brand name below logo -->
      <div class="pf-hero__brand-label">
        <span class="pf-hero__brand-dot"></span>
        <strong>Blute</strong>&nbsp;Technologies
        <span class="pf-hero__brand-dot"></span>
      </div>
    </div>

    <!-- RIGHT: Quote carousel -->
    <div class="pf-hero__quote-col">

      <!-- Top label -->
      <div class="pf-hero__label">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon
            points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
        </svg>
        Our Story in Pictures
      </div>

      <!-- Quote rotator -->
      <div class="pf-hero__rotator">
        <div class="pf-hero__q" *ngFor="let q of heroQuotes; let qi = index"
          [class.pf-hero__q--in]="activeQuoteIndex === qi" [class.pf-hero__q--out]="exitQuoteIndex === qi">
          <div class="pf-hero__q-mark">"</div>
          <p class="pf-hero__q-text">{{ q.text }}</p>
          <div class="pf-hero__q-footer">
            <div class="pf-hero__q-line"></div>
            <span class="pf-hero__q-author">{{ q.author }}</span>
          </div>
        </div>
      </div>

      <!-- Progress dots -->
      <div class="pf-hero__progress">
        <button class="pf-hero__prog-dot" *ngFor="let q of heroQuotes; let qi = index"
          [class.active]="activeQuoteIndex === qi" (click)="setQuote(qi)">
        </button>
      </div>


    </div>

  </div>
</section>

<!-- ===== FILTER BAR ===== -->
<div class="pf-filter">
  <div class="pf-filter__inner">
    <div class="pf-filter__btns">
      <button *ngFor="let f of filters" class="pf-filter__btn" [class.pf-filter__btn--active]="activeFilter === f"
        (click)="setFilter(f)">
        {{ f }}
        <span class="pf-filter__count" *ngIf="activeFilter === f">{{ filteredImages.length }}</span>
      </button>
    </div>
    <p class="pf-filter__info">
      <span class="pf-filter__num">{{ filteredImages.length }}</span> moments
    </p>
  </div>
</div>

<!-- ===== GALLERY ===== -->
<section class="pf-gallery">
  <div class="pf-gallery__grid" [@staggerGrid]="filteredImages.length">

    <article *ngFor="let img of filteredImages; let i = index" class="pf-card" [class.pf-card--wide]="i % 7 === 0"
      (click)="openLightbox(img)">

      <!-- Image -->
      <div class="pf-card__media">
        <img class="pf-card__img" [src]="img.src" [alt]="img.alt" loading="lazy" (error)="onImgError($event)" />
        <div class="pf-card__tint"></div>
        <div class="pf-card__sweep"></div>

        <!-- Number badge always visible bottom-left -->
        <div class="pf-card__badge">{{ i + 1 }}</div>

        <!-- Top row overlays -->
        <div class="pf-card__toprow">
          <span class="pf-card__cat">{{ img.category }}</span>
          <div class="pf-card__zoom">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
            </svg>
          </div>
        </div>

        <!-- Quote slides up -->
        <div class="pf-card__qslide">
          <svg class="pf-card__qicon" width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
            <path
              d="M14.017 21v-7.391c0-5.704 3.731-9.57 8.983-10.609l.995 2.151c-2.432.917-3.995 3.638-3.995 5.849h4v10h-9.983zm-14.017 0v-7.391c0-5.704 3.748-9.57 9-10.609l.996 2.151c-2.433.917-3.996 3.638-3.996 5.849h3.983v10h-9.983z" />
          </svg>
          <p>{{ img.quote }}</p>
        </div>
      </div>
      <!-- NO footer div below image -->
    </article>

  </div>
</section>

<!-- ===== LIGHTBOX ===== -->
<div class="pf-lb" *ngIf="selectedImage" (click)="closeLightbox()" @lightboxAnim>
  <div class="pf-lb__bg"></div>

  <div class="pf-lb__box" (click)="$event.stopPropagation()" @lightboxContent>

    <button class="pf-lb__x" (click)="closeLightbox()">
      <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>

    <div class="pf-lb__img">
      <img [src]="selectedImage.src" [alt]="selectedImage.alt" />
      <div class="pf-lb__img-overlay"></div>
    </div>

    <div class="pf-lb__body">
      <span class="pf-lb__cat">{{ selectedImage.category }}</span>
      <h3 class="pf-lb__title">{{ selectedImage.alt }}</h3>
      <div class="pf-lb__quote">
        <div class="pf-lb__qmark">"</div>
        <p>{{ selectedImage.quote }}</p>
      </div>
      <div class="pf-lb__bar"></div>
      <div class="pf-lb__nav">
        <button class="pf-lb__btn pf-lb__btn--prev" (click)="prevImage()">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
          Prev
        </button>
        <span class="pf-lb__counter">{{ selectedIndex + 1 }} / {{ filteredImages.length }}</span>
        <button class="pf-lb__btn pf-lb__btn--next" (click)="nextImage()">
          Next
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
