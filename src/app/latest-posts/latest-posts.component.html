<!-- latest-posts.component.html — Home page: Horizontal scrolling carousel -->
<section
  *ngIf="loading() || posts().length"
  class="w-full py-20 lg:py-28"
  style="background-color: var(--color-bg-surface);"
  aria-labelledby="latest-posts-heading"
>
  <div class="max-w-7xl mx-auto px-6">

    <!-- SECTION HEADER -->
    <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-6 mb-12">
      <div class="max-w-2xl">
        <span
          class="inline-flex items-center gap-2 text-xs font-semibold tracking-widest uppercase mb-4"
          style="color: var(--color-accent);"
        >
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.63-1.85 3.36-1.85 3.59 0 4.25 2.36 4.25 5.44v6.3zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.55V9h3.57v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.72V1.72C24 .77 23.2 0 22.22 0z"
            />
          </svg>
          From LinkedIn
        </span>

        <h2
          id="latest-posts-heading"
          class="text-3xl sm:text-4xl lg:text-[2.75rem] leading-tight font-semibold tracking-tight"
          style="font-family: var(--font-display); color: var(--color-text-primary);"
        >
          Latest thinking from our team
        </h2>

        <p class="mt-4 text-base sm:text-lg leading-relaxed" style="color: var(--color-text-secondary);">
          Engineering notes, product updates, and what we are learning building software for enterprise teams.
        </p>
      </div>

      <!-- Header actions: Arrow controls & View All link -->
      <div class="flex items-center gap-4 flex-shrink-0">
        <!-- Navigation Arrow Buttons -->
        <div class="hidden sm:flex items-center gap-2">
          <button
            type="button"
            (click)="scrollLeft()"
            class="w-10 h-10 rounded-full flex items-center justify-center border border-slate-300 hover:border-slate-400 bg-white hover:bg-slate-50 text-slate-700 transition-all shadow-sm active:scale-95 cursor-pointer"
            aria-label="Scroll insights left"
          >
            <svg class="w-4 h-4 -translate-x-0.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
            </svg>
          </button>
          <button
            type="button"
            (click)="scrollRight()"
            class="w-10 h-10 rounded-full flex items-center justify-center border border-slate-300 hover:border-slate-400 bg-white hover:bg-slate-50 text-slate-700 transition-all shadow-sm active:scale-95 cursor-pointer"
            aria-label="Scroll insights right"
          >
            <svg class="w-4 h-4 translate-x-0.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
            </svg>
          </button>
        </div>

        <a
          routerLink="/insights"
          class="inline-flex items-center gap-2 text-sm font-semibold rounded-md focus-visible:outline-2 focus-visible:outline-offset-4"
          style="color: var(--color-accent); outline-color: var(--color-accent);"
          aria-label="View all insights from Blute Technologies"
        >
          View all insights
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3" />
          </svg>
        </a>
      </div>
    </div>

    <!-- LOADING SKELETONS -->
    <div *ngIf="loading()" class="flex gap-6 overflow-hidden pb-4">
      <div *ngFor="let p of [0, 1, 2, 3]" class="w-[340px] h-[440px] flex-shrink-0 rounded-2xl border border-slate-200 bg-white animate-pulse p-4">
        <div class="w-full aspect-[16/9] bg-slate-100 rounded-xl mb-4"></div>
        <div class="h-4 bg-slate-100 rounded w-1/3 mb-3"></div>
        <div class="h-5 bg-slate-100 rounded w-3/4 mb-3"></div>
        <div class="h-4 bg-slate-100 rounded w-full mb-2"></div>
        <div class="h-4 bg-slate-100 rounded w-5/6"></div>
      </div>
    </div>

    <!-- HORIZONTAL SCROLLING CAROUSEL -->
    <div
      *ngIf="!loading() && posts().length"
      #scrollContainer
      class="flex gap-6 overflow-x-auto snap-x snap-mandatory scroll-smooth no-scrollbar pb-6 pt-2 px-1"
    >
      <div
        *ngFor="let post of posts()"
        class="w-[320px] sm:w-[360px] flex-shrink-0 snap-start h-full"
      >
        <app-post-card [post]="post"></app-post-card>
      </div>
    </div>

    <!-- BOTTOM VIEW ALL BUTTON -->
    <div *ngIf="!loading()" class="flex justify-center mt-8">
      <a
        routerLink="/insights"
        class="inline-flex items-center gap-3 px-8 py-4 rounded-full text-sm font-bold text-white shadow-lg transition-all duration-200 hover:-translate-y-0.5 hover:shadow-xl"
        style="background-color: var(--color-accent);"
      >
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.63-1.85 3.36-1.85 3.59 0 4.25 2.36 4.25 5.44v6.3zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.55V9h3.57v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.72V1.72C24 .77 23.2 0 22.22 0z"
          />
        </svg>
        View All Insights
      </a>
    </div>

  </div>
</section>
