<!-- latest-posts.component.html — Home page: full featured post + compact previews + View All -->
<section
  *ngIf="loading() || posts().length"
  class="w-full py-20 lg:py-28"
  style="background-color: var(--color-bg-surface);"
  aria-labelledby="latest-posts-heading"
>
  <div class="max-w-7xl mx-auto px-6">

    <!-- Section header -->
    <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-6 mb-12">
      <div class="max-w-2xl">
        <span
          class="inline-flex items-center gap-2 text-xs font-semibold tracking-widest uppercase mb-4"
          style="color: var(--color-accent);"
        >
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.63-1.85 3.36-1.85 3.59 0 4.25 2.36 4.25 5.44v6.3zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.55V9h3.57v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.72V1.72C24 .77 23.2 0 22.22 0z"
            />
          </svg>
          From LinkedIn
        </span>

        <h2
          id="latest-posts-heading"
          class="text-3xl sm:text-4xl lg:text-[2.75rem] leading-tight font-semibold tracking-tight"
          style="font-family: var(--font-display); color: var(--color-text-primary);"
        >
          Latest thinking from our team
        </h2>

        <p class="mt-4 text-base sm:text-lg leading-relaxed" style="color: var(--color-text-secondary);">
          Engineering notes, product updates, and what we are learning building software for enterprise teams.
        </p>
      </div>

      <a
        routerLink="/insights"
        class="inline-flex items-center gap-2 flex-shrink-0 text-sm font-semibold rounded-md focus-visible:outline-2 focus-visible:outline-offset-4"
        style="color: var(--color-accent); outline-color: var(--color-accent);"
        aria-label="View all insights from Blute Technologies"
      >
        View all insights
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3" />
        </svg>
      </a>
    </div>

    <!-- Loading skeleton -->
    <ng-container *ngIf="loading()">
      <div class="w-full rounded-3xl border border-slate-200 bg-white animate-pulse mb-10" style="height: 600px;"></div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div *ngFor="let p of [0,1,2]" class="h-64 rounded-2xl border border-slate-200 bg-white animate-pulse"></div>
      </div>
    </ng-container>

    <!-- FEATURED FULL POST (first LinkedIn post, fully embedded, no internal scroll) -->
    <ng-container *ngIf="!loading() && featuredPost()">
      <div class="w-full mb-10 rounded-3xl overflow-hidden bg-white border border-slate-200/80 shadow-xl">
        <div *ngIf="featuredPost()!.linkedInUrl | safeUrl as embedUrl" class="w-full bg-white">
          <iframe
            [src]="embedUrl"
            [style.height.px]="featuredPost()!.embedHeight || 1600"
            scrolling="no"
            loading="eager"
            class="w-full block border-0"
            frameborder="0"
            allowfullscreen
            title="LinkedIn Featured Post"
          ></iframe>
        </div>
      </div>
    </ng-container>

    <!-- COMPACT PREVIEW CARDS (remaining posts, link to /insights) -->
    <div *ngIf="!loading() && previewPosts().length" class="grid grid-cols-1 md:grid-cols-3 gap-6 lg:gap-8 mb-12">
      <app-post-card *ngFor="let post of previewPosts()" [post]="post"></app-post-card>
    </div>

    <!-- VIEW ALL BUTTON -->
    <div *ngIf="!loading()" class="flex justify-center mt-4">
      <a
        routerLink="/insights"
        class="inline-flex items-center gap-3 px-8 py-4 rounded-full text-sm font-bold text-white shadow-lg transition-all duration-200 hover:-translate-y-0.5 hover:shadow-xl"
        style="background-color: var(--color-accent);"
      >
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.63-1.85 3.36-1.85 3.59 0 4.25 2.36 4.25 5.44v6.3zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.55V9h3.57v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.72V1.72C24 .77 23.2 0 22.22 0z"
          />
        </svg>
        View All Insights
      </a>
    </div>

  </div>
</section>
